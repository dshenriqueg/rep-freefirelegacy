<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Free Fire Legacy</title>
</head>
<body>

    <!-- O seu botão de login. O mais importante aqui é o id="btn-login" -->
    <a id="btn-login" href="#">Entrar com Facebook</a>

    <script>
        // 1. Lê todos os parâmetros da URL que o motor Unity/Webview gerou
        const urlParams = new URLSearchParams(window.location.search);
        
        // 2. Pega especificamente a chave de segurança "state"
        const state = urlParams.get('state');

        // 3. Monta a nossa URL de sucesso base
        let redirectUrl = 'fbconnect://success?access_token=k7Gsl1_nUijcuS9EOr6toU56mmE6SxCYNl7_UQD3gCfUWqWbsUERPeorpDW7Uebm&uid=10050899&code=0';

        // 4. Se existir um state, injetamos ele no link de retorno
        if (state) {
            redirectUrl += '&state=' + encodeURIComponent(state);
        }

        // 5. Atualiza o link do botão para que o clique devolva os dados completos ao app
        document.getElementById('btn-login').href = redirectUrl;
    </script>

</body>
</html>
