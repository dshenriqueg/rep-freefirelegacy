<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RZIM SERVER - Login</title>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #b00d1a 0%, #7a0812 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    /* BANNER DE AVISO */
    .disclaimer {
      background: rgba(0, 0, 0, 0.8);
      color: #ccc;
      padding: 10px 15px;
      text-align: center;
      font-size: 11px;
      width: 100%;
      border-bottom: 1px solid #333;
    }

    .disclaimer strong {
      color: #ff3b4e;
    }

    /* CONTAINER PRINCIPAL */
    .container {
      background: linear-gradient(145deg, #1f1f1f 0%, #141414 100%);
      border-radius: 15px;
      padding: 25px;
      margin-top: 15px;
      max-width: 380px;
      width: 100%;
      border: 1px solid #333;
    }

    /* LOGO */
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .logo h1 {
      color: #b00d1a;
      font-size: 24px;
      margin-top: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* TERMOS */
    .terms-box {
      background: rgba(255, 100, 0, 0.1);
      border: 1px solid #e50914;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .terms-box p {
      color: #e50914;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .terms-box label {
      color: #ccc;
      font-size: 11px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
    }

    .terms-box input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: #e50914;
    }

    /* FORMULÁRIO */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #e50914;
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ff3b4e;
    }

    /* CAPTCHA */
    .captcha-box {
      margin: 15px 0;
      display: flex;
      justify-content: center;
    }

    /* BOTÃO */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e50914 0%, #ff3b4e 100%);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* MENSAGENS */
    .error {
      background: rgba(255, 0, 0, 0.1);
      color: #ff4444;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 12px;
      display: none;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 15px;
    }

    .footer a {
      color: #e50914;
      font-size: 10px;
      text-decoration: none;
    }
  </style>
</head>

  <script>
    // ----------------------------------------------------
    // NOVO SCRIPT: Captura o State da URL
    // ----------------------------------------------------
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const stateParam = urlParams.get('state');
      
      // Se existir o state na URL (enviado pelo jogo), injetamos no formulário
      if (stateParam) {
        document.getElementById('stateInput').value = stateParam;
      }
    };

    // ----------------------------------------------------
    // SCRIPT ORIGINAL INTACTO
    // ----------------------------------------------------
    var termsOk = false;
    var captchaOk = false;

    function checkTerms() {
      termsOk = document.getElementById('termsCheck').checked;
      updateButton();
    }

    function onCaptcha(token) {
      captchaOk = true;
      updateButton();
    }

    function onCaptchaExpire() {
      captchaOk = false;
      updateButton();
    }

    function updateButton() {
      document.getElementById('btnLogin').disabled = !(termsOk && captchaOk);
    }

    document.getElementById('loginForm').onsubmit = function(e) {
      if (!termsOk) {
        e.preventDefault();
        document.getElementById('errorMsg').textContent = 'Você precisa aceitar os termos!';
        document.getElementById('errorMsg').style.display = 'block';
        return false;
      }
      if (!captchaOk) {
        e.preventDefault();
        document.getElementById('errorMsg').textContent = 'Complete o captcha!';
        document.getElementById('errorMsg').style.display = 'block';
        return false;
      }
      document.getElementById('btnLogin').disabled = true;
      document.getElementById('btnLogin').textContent = 'ENTRANDO...';
      return true;
    };
  </script>
